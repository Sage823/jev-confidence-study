[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-confidence-study"
version = "0.1.0"
description = "Frozen-input Jev and Qwen confidence-signal study"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qwen = ["torch>=2.5", "transformers>=4.51", "accelerate>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

